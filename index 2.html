<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#263548">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マイスケジュール">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>マイスケジュール</title>
<script>
// 表示モード(自動/ライト/ダーク)は、このスマホごとに覚える。画面が出る前に反映してチラつきを防ぐ
try { var t = localStorage.getItem("myschedule.theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: モバイル優先の1カラム。月ヘッダー、7列カレンダー(各日に色付きの予定チップ)、下に月の予定一覧。日付タップで下から入力シート */
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --fg:#1F2B3A; --muted:#6B7785; --line:#DDE3EA;
  --navy:#263548; --on-navy:#FFFFFF; --dim:#EEF0F3; --dim-fg:#B3BCC6; --workday:#E9ECEF; --ghost:#98A2AD;
  --sun:#C0392B; --sat:#2E6DB4; --today:#263548; --danger:#B3261E;
  --shadow:0 10px 30px rgba(20,32,48,.18);
  /* 予定の色 */
  --sky-bg:#CDEEFA; --sky-fg:#0A5874;
  --blue-bg:#2F6BD8; --blue-fg:#FFFFFF;
  --pink-bg:#FAD3DE; --pink-fg:#8A1F43;
  --rose-bg:#D63A74; --rose-fg:#FFFFFF;
  --sage-bg:#D6E6CF; --sage-fg:#33522D;
  --lgray-bg:#E8E2D9; --lgray-fg:#5A4F42;
  --green-bg:#D3F0DD; --green-fg:#1D6B3C;
  --orange-bg:#FDE1C4; --orange-fg:#8A4A0F;
  --purple-bg:#E6DAF7; --purple-fg:#5B2E99;
  --gray-bg:#E4E8ED; --gray-fg:#46525F;
  --f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",system-ui,sans-serif;
  --f-display:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151D; --surface:#18202B; --fg:#E6ECF2; --muted:#93A0AE; --line:#2A3443;
  --navy:#2C3D55; --on-navy:#FFFFFF; --dim:#0B0F15; --dim-fg:#4D5966; --workday:#232B35; --ghost:#66727F;
  --sun:#FF7B6E; --sat:#7EB2F2; --today:#B9CCE6; --danger:#FF8A80;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --sky-bg:#123F52; --sky-fg:#A9E4FA; --blue-bg:#3D74DB; --blue-fg:#FFFFFF;
  --pink-bg:#4A2B3A; --pink-fg:#FFC2D4; --rose-bg:#C2386C; --rose-fg:#FFFFFF; --sage-bg:#28402A; --sage-fg:#C6E2BE; --lgray-bg:#3A342C; --lgray-fg:#E6DCCD; --green-bg:#1C4630; --green-fg:#B4EBC8;
  --orange-bg:#553519; --orange-fg:#FFD3A6; --purple-bg:#3E2A63; --purple-fg:#DCC9FA;
  --gray-bg:#2C3541; --gray-fg:#C8D1DB; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151D; --surface:#18202B; --fg:#E6ECF2; --muted:#93A0AE; --line:#2A3443;
  --navy:#2C3D55; --on-navy:#FFFFFF; --dim:#0B0F15; --dim-fg:#4D5966; --workday:#232B35; --ghost:#66727F;
  --sun:#FF7B6E; --sat:#7EB2F2; --today:#B9CCE6; --danger:#FF8A80;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --sky-bg:#123F52; --sky-fg:#A9E4FA; --blue-bg:#3D74DB; --blue-fg:#FFFFFF;
  --pink-bg:#4A2B3A; --pink-fg:#FFC2D4; --rose-bg:#C2386C; --rose-fg:#FFFFFF; --sage-bg:#28402A; --sage-fg:#C6E2BE; --lgray-bg:#3A342C; --lgray-fg:#E6DCCD; --green-bg:#1C4630; --green-fg:#B4EBC8;
  --orange-bg:#553519; --orange-fg:#FFD3A6; --purple-bg:#3E2A63; --purple-fg:#DCC9FA;
  --gray-bg:#2C3541; --gray-fg:#C8D1DB; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-block:12px 40px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sat);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--navy);color:var(--on-navy)}
.monthbar{display:flex;align-items:center;gap:6px;padding:0 2px 10px}
.monthbar h1{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;flex:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.monthbar h1 small{font-size:15px;color:var(--muted);margin-right:4px;font-weight:700}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-size:16px}
.todaybtn{height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px}

/* colors */
.c-sky{background:var(--sky-bg);color:var(--sky-fg)}
.c-blue{background:var(--blue-bg);color:var(--blue-fg)}
.c-pink{background:var(--pink-bg);color:var(--pink-fg)}
.c-rose{background:var(--rose-bg);color:var(--rose-fg)}
.c-sage{background:var(--sage-bg);color:var(--sage-fg)}
.c-lgray{background:var(--lgray-bg);color:var(--lgray-fg)}
.c-green{background:var(--green-bg);color:var(--green-fg)}
.c-orange{background:var(--orange-bg);color:var(--orange-fg)}
.c-purple{background:var(--purple-bg);color:var(--purple-fg)}
.c-gray{background:var(--gray-bg);color:var(--gray-fg)}

/* calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:pan-y;user-select:none}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{background:var(--navy);color:var(--on-navy);text-align:center;font-size:12px;font-weight:700;padding:7px 0;letter-spacing:.08em}
.dow div:first-child{color:#FFB3AB}
.dow div:last-child{color:#AFCBF2}
.grid{overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;grid-auto-rows:var(--rowh,110px);height:calc(100dvh - 190px);scrollbar-width:none}
.grid::-webkit-scrollbar{display:none}
.cell{min-height:0;overflow:hidden;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 2px 5px;display:flex;flex-direction:column;gap:2px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.cell:nth-child(7n){border-right:0}
.cell.out{background:var(--dim)!important}
.cell.out .chip{background:transparent!important;color:var(--ghost)!important;font-weight:400;padding:1px 3px}
.chip.fillonly{display:none}
.cell.out .chip.fillonly{display:block}
.cell.out .d{color:var(--ghost)!important}
.cell.out .hn{color:var(--ghost)}
.chip.ghost{background:transparent;color:var(--ghost);font-weight:400;padding:1px 3px}
.cell.workday{background:var(--workday)}
.d{display:flex;flex-wrap:wrap;align-items:center;column-gap:1px;row-gap:2px;font-weight:700;font-size:13px;line-height:1;padding-left:2px;font-variant-numeric:tabular-nums;min-width:0}
.d .rl{white-space:nowrap;letter-spacing:-.02em;font-size:9px;line-height:1.2}
.d .num{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:999px}
.cell.today .d .num{background:var(--today);color:var(--surface)}
.d.sun,.d.holi{color:var(--sun)}
.d.sat{color:var(--sat)}
.hn{font-size:9px;color:var(--sun);line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-left:2px}
.chip{display:block;font-size:10px;line-height:1.25;padding:2px 3px;border-radius:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip.b{font-weight:700}
.chip .nm{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip .t{display:block;font-size:8.5px;line-height:1.2;opacity:.85;font-weight:400;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cell.fill .chip.isfill{background:transparent;text-align:center;font-size:13px;font-weight:700;padding:4px 0}
.cell.today.fill .d .num{background:var(--today);color:var(--surface)}
.times{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.times span{color:var(--muted)}
input[type=time]{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.tedit{display:grid;grid-template-columns:1fr auto 1fr auto;gap:6px;align-items:center;margin-top:6px;width:100%}
.tedit input[type=text]{grid-column:1/-1;font-weight:400}
.tedit .tl{grid-column:1/-1;font-size:11px;opacity:.8;font-weight:400;margin-top:2px}
.curev{flex-wrap:wrap}
.curev .tag{font-size:11px;border:1px solid currentColor;border-radius:999px;padding:0 6px;opacity:.75;flex:none}
.curev.skipped{opacity:.45}
.curev.skipped span:not(.tag){text-decoration:line-through}
.curev .tm{font-size:12px;font-variant-numeric:tabular-nums;opacity:.85;flex:none}
.more{font-size:10px;color:var(--muted);padding-left:3px}
.hint{font-size:12px;color:var(--muted);padding:8px 4px 0}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);padding:8px 4px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

/* month list */
.sec{margin-top:22px}
.sec h2{font-family:var(--f-display);font-size:16px;margin:0 0 8px 4px}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.item .when{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.item .when span{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.item .evs{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.pill{display:inline-block;font-size:13px;padding:3px 9px;border-radius:999px;max-width:100%;overflow-wrap:anywhere}
.pill.b{font-weight:700}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);font-size:13px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);max-height:88vh;overflow:auto;padding-top:10px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:up .2s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet-in{max-width:640px;margin:0 auto}
.sh-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.sh-head h3{font-family:var(--f-display);font-size:22px;margin:0;font-variant-numeric:tabular-nums}
.sh-head .hname{color:var(--sun);font-size:13px;font-weight:700}
.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:16px 0 6px}
.cur{display:flex;flex-direction:column;gap:6px}
.curev{display:flex;align-items:center;gap:8px;border-radius:10px;padding:8px 8px 8px 12px;font-size:15px}
.curev.b{font-weight:700}
.curev span{flex:1;min-width:0;overflow-wrap:anywhere}
.curev button{border:0;background:rgba(0,0,0,.08);border-radius:8px;height:32px;padding:0 10px;cursor:pointer;font-size:12px;color:inherit}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.qbtn{border:0;border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.qbtn.b{font-weight:700}
.qbtn[disabled]{opacity:.35;cursor:default}
.free{display:grid;grid-template-columns:1fr auto;gap:8px}
.catsel{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{height:38px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seg-note{font-size:12px;color:var(--muted);padding:8px 2px 2px}
.catsel button{border:1.5px solid transparent;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.catsel button[aria-pressed="true"]{border-color:var(--fg)}
textarea,input[type=text],input[type=date],select{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.row{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.small{flex:none;height:46px;padding:0 16px}
.btn:disabled{opacity:.5}

/* settings */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 12px}
.grp{font-size:12px;font-weight:700;color:var(--muted);padding:10px 0 2px;display:flex;align-items:center;gap:8px}
.grp i{width:12px;height:12px;border-radius:3px;display:inline-block}
.prow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.pact{display:flex;gap:4px;align-items:center}
.mini{height:34px;min-width:34px;padding:0 8px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12px}
.mini.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy);font-weight:700}
.mini.del{color:var(--danger)}
.addbtn{margin-top:10px;width:100%;height:44px;border-radius:12px;border:1px dashed var(--line);background:transparent;cursor:pointer;color:var(--muted);font-weight:700}
.hrow{display:grid;grid-template-columns:118px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.hrow:last-child{border-bottom:0}
.hrow .hd{font-variant-numeric:tabular-nums}
.help{font-size:12px;color:var(--muted);margin:6px 4px 0}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.chk input{width:20px;height:20px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:10px;border:2px solid transparent;cursor:pointer;font-size:11px}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.confirm{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--pink-bg);color:var(--pink-fg);font-size:13px}

.sync-status{font-size:13px;color:var(--muted)}
.sync-status.ok{color:var(--fg)}
.sync-status.err{color:var(--danger)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;box-shadow:var(--shadow)}
.banner{background:var(--orange-bg);color:var(--orange-fg);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
@media (min-width:600px){.cell{padding:6px 4px}.chip{font-size:12px}.d{font-size:14px}}
/* スマホ: カレンダーを画面の横幅いっぱい・高さいっぱいに。週は上下にスクロールでき、月をまたいでつながる(1画面に5週) */
@media (max-width:599px){
  body.calmode{overflow:hidden}
  body.calmode .wrap{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;padding-block:6px 0;padding-left:0;padding-right:0}
  body.calmode .top,body.calmode .monthbar,body.calmode #banner{margin-left:max(12px,env(safe-area-inset-left,0px));margin-right:max(12px,env(safe-area-inset-right,0px))}
  body.calmode .top{padding:2px 0 6px}
  body.calmode .monthbar{padding:0 0 8px}
  body.calmode #view-cal{flex:1;display:flex;flex-direction:column;min-height:0}
  body.calmode .cal{flex:1;display:flex;flex-direction:column;min-height:0;border-radius:0;border-left:0;border-right:0;border-bottom:0}
  body.calmode .grid{flex:1;min-height:0;height:auto}
  body.calmode .cell:nth-child(7n+1){padding-left:max(2px,env(safe-area-inset-left,0px))}
  body.calmode .cell:nth-child(7n){padding-right:max(2px,env(safe-area-inset-right,0px))}
}
</style>
</head>
<body class="calmode">
<div class="wrap">
  <div class="top">
    <div class="brand">マイスケジュール</div>
    <button class="iconbtn" id="btn-view" aria-label="設定">⚙</button>
  </div>

  <div id="banner" class="banner" hidden></div>

  <section id="view-cal">
    <div class="monthbar">
      <h1 id="mtitle"><small>2026年</small>10月</h1>
      <button class="todaybtn" id="btn-today">今月</button>
      <button class="iconbtn" id="btn-prev" aria-label="前の月">◀</button>
      <button class="iconbtn" id="btn-next" aria-label="次の月">▶</button>
    </div>
    <div class="cal" id="cal">
      <div class="dow"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section id="view-set" hidden>
    <div class="sec" style="margin-top:4px">
      <h2>表示</h2>
      <div class="card" style="padding:12px">
        <div class="seg" id="theme-seg" role="group" aria-label="表示モード">
          <button data-theme-v="auto">自動</button><button data-theme-v="light">ライト</button><button data-theme-v="dark">ダーク</button>
        </div>
        <div class="seg-note">自動は iPhone の設定(ライト/ダーク)に合わせます。この設定はスマホごとに保存されます。</div>
      </div>
    </div>
    <div class="sec">
      <h2>カテゴリ</h2>
      <div class="card" id="clist"></div>
      <button class="addbtn" id="btn-addc">＋ カテゴリを追加</button>
    </div>
    <div class="sec">
      <h2>よく使う予定</h2>
      <div class="card" id="plist"></div>
      <button class="addbtn" id="btn-addp">＋ よく使う予定を追加</button>
    </div>
    <div class="sec">
      <h2>繰り返しの予定</h2>
      <div class="card" id="rlist"></div>
      <button class="addbtn" id="btn-addr">＋ 繰り返しの予定を追加</button>
    </div>
    <div class="sec">
      <h2>2台のスマホで同期</h2>
      <div class="card" style="padding:12px">
        <div id="sync-status" class="sync-status">未接続</div>
        <div id="sync-off">
          <div class="lbl"><label for="sync-code">接続コード</label></div>
          <textarea id="sync-code" rows="3" placeholder="接続コードを貼り付け" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
          <div class="row"><button class="btn pri" id="sync-connect">接続する</button></div>
        </div>
        <div id="sync-on" hidden>
          <div class="row"><button class="btn" id="sync-now">今すぐ同期</button><button class="btn" id="sync-stop">同期をやめる</button></div>
        </div>
      </div>
    </div>
    <div class="sec">
      <h2>バックアップ</h2>
      <div class="card" style="padding:12px">
        <div class="row" style="margin-top:0"><button class="btn" id="btn-export">書き出す</button><button class="btn" id="btn-import">読み込む</button></div>
        <input type="file" id="imp-file" accept="application/json,.json" hidden>
        <div id="impconf"></div>
      </div>
    </div>
    <div class="sec">
      <h2>祝日</h2>
      <div class="card" id="hlist"></div>
      <button class="addbtn" id="btn-addh">＋ 祝日を追加</button>
    </div>
  </section>
</div>

<div id="scrim" class="scrim" hidden></div>
<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sh-title">
  <div class="grab"></div>
  <div class="sheet-in" id="sheet-in"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
  "use strict";
  const WD = ["日","月","火","水","木","金","土"];
  const COLORS = [["sky","水色"],["blue","青"],["sage","セージグリーン"],["lgray","グレージュ"],["rose","濃いピンク"],["pink","ピンク"],["green","緑"],["orange","オレンジ"],["purple","紫"],["gray","グレー"]];
  const COLOR_IDS = COLORS.map(c => c[0]);
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2,"0");
  const key = (y,m,d) => y + "-" + pad(m) + "-" + pad(d);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const now = new Date();
  const todayKey = key(now.getFullYear(), now.getMonth()+1, now.getDate());

  const state = {
    y: now.getFullYear(), m: now.getMonth()+1,
    days: {},        // "YYYY-MM-DD" -> [{name, cat}]
    cats: [],        // [{id, name, color}]
    items: [],       // [{name, cat, bold, color?}]
    holidays: [],    // [{date, name}]
    rec: [],         // [{name, cat, type:"weekly"|"monthly", dow?, day?}]
    skips: {},       // "YYYY-MM-DD" -> [name] 繰り返しを消した日
    db: null, ready: false, view: "cal",
  };

  // ---------- helpers ----------
  function toast(msg){ const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 1800); }
  const holidayName = (k) => { const h = state.holidays.find(x => x.date === k); return h ? h.name : ""; };
  const catById = (id) => state.cats.find(c => c.id === id);
  const itemByName = (n) => state.items.find(i => i.name === n);
  function evStyle(ev){
    const it = itemByName(ev.name);
    const cat = catById(it ? it.cat : ev.cat) || catById(ev.cat);
    let color = (it && it.color) || (cat && cat.color) || "gray";
    if (!COLOR_IDS.includes(color)) color = "gray";
    return {cls: "c-" + color, bold: !!(it && it.bold), fill: !!(it && it.fill)};
  }
  function dateOf(k){ return new Date(+k.slice(0,4), +k.slice(5,7)-1, +k.slice(8,10)); }
  const timeText = (ev) => ev.start ? ev.start + "～" + (ev.end || "") : "";
  function sortEvs(list){
    return list.map((e,i) => [e,i]).sort((a,b) => {
      const sa = a[0].start || "", sb = b[0].start || "";
      if (sa === sb) return a[1] - b[1];
      if (!sa) return -1; if (!sb) return 1;
      return sa < sb ? -1 : 1;
    }).map(x => x[0]);
  }
  function cleanEv(e){ const r = {name: String(e.name || ""), cat: String(e.cat || "")}; if (e.start) r.start = String(e.start); if (e.end) r.end = String(e.end); return r; }

  function recurOn(k, includeSkipped){
    const d = dateOf(k); const sk = state.skips[k] || [];
    const hit = state.rec.filter(r => (r.type === "weekly" && d.getDay() === r.dow) || (r.type === "monthly" && d.getDate() === r.day));
    // 毎月の予定と毎週の予定が同じ日に重なったら、毎月の予定だけを表示
    const hasMonthly = hit.some(r => r.type === "monthly");
    return hit.filter(r => !hasMonthly || r.type === "monthly")
      .filter(r => includeSkipped || !sk.includes(r.name))
      .map(r => ({name: r.name, cat: r.cat, rec: r.type}));
  }
  function allEvs(k){
    const own = state.days[k] || [];
    return sortEvs(recurOn(k).filter(r => !own.some(e => e.name === r.name)).concat(own));
  }
  const recText = (r) => r.type === "weekly" ? "毎週" + WD[r.dow] + "曜" : "毎月" + r.day + "日";

  // ---------- render ----------
  function catFill(ev){ const it = itemByName(ev.name); const c = catById(it ? it.cat : ev.cat) || catById(ev.cat); return !!(c && c.fill); }
  // カレンダーは週を縦に並べた1本の帯。上下にスクロールでき、月をまたいでつながる
  const cal = { r0: null, nw: 0, rowh: 0, lock: 0 };
  const ROWS_PER_SCREEN = 5;
  const BACK_MONTHS = 3, FWD_MONTHS = 7; // 用意しておく範囲(端に近づいたら自動で足す)
  const ymOf = (y, m) => y + "-" + String(m).padStart(2, "0");
  const sunOf = (y, m, d) => { const t = new Date(y, m-1, d); return new Date(y, m-1, d - t.getDay()); };
  const weekIndex = (y, m, d) => Math.round((sunOf(y, m, d) - cal.r0) / 6048e5);
  function ensureRange(y, m){
    // 表示している月の前3か月〜後6か月分の週を用意(はみ出たら広げる)
    const s0 = sunOf(y, m - BACK_MONTHS, 1), e0 = sunOf(y, m + FWD_MONTHS, 1);
    if (!cal.r0){ cal.r0 = s0; cal.nw = Math.round((e0 - s0) / 6048e5); return 0; }
    let added = 0;
    if (s0 < cal.r0){ added = Math.round((cal.r0 - s0) / 6048e5); cal.r0 = s0; cal.nw += added; }
    const end = new Date(cal.r0.getFullYear(), cal.r0.getMonth(), cal.r0.getDate() + cal.nw * 7);
    if (e0 > end) cal.nw += Math.round((e0 - end) / 6048e5);
    return added;
  }
  function cellHtml(dt){
    const dy = dt.getFullYear(), dm = dt.getMonth()+1, day = dt.getDate();
    const k = key(dy, dm, day);
    const all = allEvs(k);
    const recl = all.filter(ev => ev.rec).map(ev => "＜" + esc(ev.name) + "＞").join("");
    const evs = all.filter(ev => !ev.rec);
    const hn = holidayName(k);
    const dcls = "d" + (hn ? " holi" : dt.getDay() === 0 ? " sun" : dt.getDay() === 6 ? " sat" : "");
    let cls = "cell" + (ymOf(dy, dm) === ymOf(state.y, state.m) ? "" : " out"), style = "";
    // 塗りつぶし: 予定ごとの塗り(休など) > 塗りありカテゴリ。ほかの月の日はグレー(CSSで切り替え)
    const fillEv = evs.find(ev => evStyle(ev).fill);
    if (fillEv) style = ' style="background:var(--' + evStyle(fillEv).cls.slice(2) + '-bg)"';
    else if (evs.some(catFill)) cls += " workday";
    const vis = evs.filter(ev => !evStyle(ev).fill);
    const chip = (ev, extra) => { const s = evStyle(ev); return '<span class="chip ' + s.cls + (s.bold ? " b" : "") + (extra || "") + '">' + '<span class="nm">' + esc(ev.name) + "</span>" + (ev.start ? '<span class="t">' + esc(timeText(ev)) + "</span>" : "") + "</span>"; };
    let chips = (fillEv ? chip(fillEv, " fillonly") : "") + vis.slice(0,3).map(ev => chip(ev)).join("");
    if (vis.length > 3) chips += '<span class="more">+' + (vis.length - 3) + "</span>";
    if (k === todayKey) cls += " today";
    const label = dm + "月" + day + "日" + (all.length ? " " + all.map(e => (e.start ? e.start + " " : "") + e.name).join("、") : "");
    return '<button class="' + cls + '" data-k="' + k + '" data-ym="' + ymOf(dy, dm) + '"' + style + ' aria-label="' + esc(label) + '">' +
      '<span class="' + dcls + '"><span class="num">' + (day === 1 ? dm + "/1" : day) + "</span>" + (recl ? '<span class="rl">' + recl + "</span>" : "") + "</span>" + (hn ? '<span class="hn">' + esc(hn) + "</span>" : "") + chips + "</button>";
  }
  function setTitle(){ $("mtitle").innerHTML = "<small>" + state.y + "年</small>" + state.m + "月"; }
  function measure(){
    const g = $("grid"); const h = g.clientHeight;
    if (h > 0){ cal.rowh = Math.max(64, Math.floor(h / ROWS_PER_SCREEN)); g.style.setProperty("--rowh", cal.rowh + "px"); }
    return cal.rowh;
  }
  function renderCal(opts){
    opts = opts || {};
    const g = $("grid");
    // いま見ている位置(何週目のどこか)を覚えておき、描き直したあとも同じ位置に戻す
    const keepTop = cal.r0 && cal.rowh ? g.scrollTop : null;
    // 端に近づいて足すときは、多めに(前後それぞれ半年ほど)足して、何度も描き直さないようにする
    const added = opts.wide ? ensureRange(state.y, state.m - 3) + ensureRange(state.y, state.m + 3) : ensureRange(state.y, state.m);
    setTitle();
    let html = "";
    for (let i = 0; i < cal.nw * 7; i++) html += cellHtml(new Date(cal.r0.getFullYear(), cal.r0.getMonth(), cal.r0.getDate() + i));
    g.innerHTML = html;
    const old = cal.rowh; measure();
    if (opts.toMonth || keepTop === null || !cal.rowh) scrollToMonth(state.y, state.m, false);
    else if (added || old !== cal.rowh) g.scrollTop = (keepTop / (old || cal.rowh) + added) * cal.rowh;
  }
  function scrollToMonth(y, m, smooth){
    const g = $("grid"); if (!measure()) return;
    const top = weekIndex(y, m, 1) * cal.rowh;
    cal.lock = Date.now() + (smooth ? 700 : 100);
    if (smooth && g.scrollTo) g.scrollTo({top, behavior: "smooth"}); else g.scrollTop = top;
  }
  function setFocus(y, m){
    if (y === state.y && m === state.m) return;
    state.y = y; state.m = m; setTitle();
    const cur = ymOf(y, m);
    $("grid").querySelectorAll(".cell").forEach(c => c.classList.toggle("out", c.dataset.ym !== cur));
  }
  let scrollRaf = 0;
  function onCalScroll(){
    scrollRaf = 0;
    const g = $("grid"); if (!cal.rowh || state.view !== "cal") return;
    // 画面の真ん中にある週の木曜日の月を「いまの月」にする
    const row = Math.floor((g.scrollTop + g.clientHeight / 2) / cal.rowh);
    const th = new Date(cal.r0.getFullYear(), cal.r0.getMonth(), cal.r0.getDate() + row * 7 + 4);
    if (Date.now() >= cal.lock) setFocus(th.getFullYear(), th.getMonth() + 1);
    // 端に近づいたら前後の週を足す
    if (g.scrollTop < cal.rowh * 10 || g.scrollTop + g.clientHeight > (cal.nw - 10) * cal.rowh){
      const y = th.getFullYear(), m = th.getMonth() + 1;
      const s0 = sunOf(y, m - BACK_MONTHS, 1), end = new Date(cal.r0.getFullYear(), cal.r0.getMonth(), cal.r0.getDate() + cal.nw * 7);
      if (s0 < cal.r0 || sunOf(y, m + FWD_MONTHS, 1) > end){ state.y = y; state.m = m; renderCal({wide: true}); }
    }
  }
  function renderSet(){
    $("clist").innerHTML = state.cats.length ? state.cats.map((c,i) =>
      '<div class="prow"><div><span class="pill c-' + esc(c.color) + '">' + esc(c.name) + '</span></div><div class="pact">' +
      '<button class="mini" data-cact="up" data-i="' + i + '" aria-label="上へ"' + (i===0?" disabled":"") + '>↑</button>' +
      '<button class="mini" data-cact="edit" data-i="' + i + '">編集</button></div></div>').join("")
      : '<div class="empty" style="border:0">カテゴリがありません。</div>';
    let ph = "";
    state.cats.forEach(c => {
      const its = state.items.map((it,i) => [it,i]).filter(([it]) => it.cat === c.id);
      ph += '<div class="grp"><i class="c-' + esc(c.color) + '"></i>' + esc(c.name) + "</div>";
      if (!its.length) ph += '<div class="prow"><span style="color:var(--muted);font-size:13px">登録なし</span><span></span></div>';
      its.forEach(([it,i]) => {
        const s = evStyle({name: it.name, cat: it.cat});
        ph += '<div class="prow"><div><span class="pill ' + s.cls + (it.bold ? " b" : "") + '">' + esc(it.name) + '</span></div><div class="pact">' +
          '<button class="mini' + (it.bold ? " on" : "") + '" data-act="bold" data-i="' + i + '" aria-pressed="' + !!it.bold + '">太字</button>' +
          '<button class="mini" data-act="up" data-i="' + i + '" aria-label="上へ">↑</button>' +
          '<button class="mini" data-act="edit" data-i="' + i + '">編集</button></div></div>';
      });
    });
    $("plist").innerHTML = ph || '<div class="empty" style="border:0">先にカテゴリを追加してください。</div>';
    $("rlist").innerHTML = state.rec.length ? state.rec.map((r,i) => { const s = evStyle(r);
      return '<div class="prow"><div><span class="pill ' + s.cls + (s.bold ? " b" : "") + '">' + esc(r.name) + '</span> <span style="font-size:13px;color:var(--muted)">' + recText(r) + '</span></div><div class="pact"><button class="mini del" data-rdel="' + i + '">削除</button></div></div>'; }).join("")
      : '<div class="empty" style="border:0">繰り返しの予定はありません。</div>';
    const hs = [...state.holidays].sort((a,b) => a.date < b.date ? -1 : 1);
    $("hlist").innerHTML = hs.length ? hs.map(h => '<div class="hrow"><span class="hd">' + h.date.replace(/-/g,"/") + "(" + WD[dateOf(h.date).getDay()] + ')</span><span>' + esc(h.name) + '</span><button class="mini del" data-hdel="' + h.date + '">削除</button></div>').join("")
      : '<div class="empty" style="border:0">祝日が登録されていません。</div>';
  }
  function render(){ if (state.view === "cal") renderCal(); else renderSet(); }

  // ---------- sheet ----------
  function openSheet(html){ $("sheet-in").innerHTML = html; $("scrim").hidden = false; $("sheet").hidden = false; document.body.style.overflow = "hidden"; }
  function closeSheet(){ $("scrim").hidden = true; $("sheet").hidden = true; $("sheet-in").innerHTML = ""; document.body.style.overflow = ""; sheetDay = null; }
  $("scrim").addEventListener("click", closeSheet);

  let sheetDay = null, freeCat = null, editTime = null;
  function openDay(k){
    sheetDay = k; editTime = null;
    ["free","ns","ne"].forEach(id => { if ($(id)) $(id).value = ""; });
    if (!freeCat || !catById(freeCat)) freeCat = (state.cats.find(c => c.id === "private") || state.cats[0] || {}).id || null;
    drawDay();
  }
  function drawDay(){
    const k = sheetDay; if (!k) return;
    const d = dateOf(k); const hn = holidayName(k);
    const evs = state.days[k] || [];
    const recs = recurOn(k, true).filter(r => !evs.some(e => e.name === r.name));
    const sk = state.skips[k] || [];
    const recHtml = recs.map(r => { const s = evStyle(r); const off = sk.includes(r.name);
      return '<div class="curev ' + s.cls + (s.bold ? " b" : "") + (off ? " skipped" : "") + '"><span class="tag">' + (r.rec === "weekly" ? "毎週" : "毎月") + "</span><span>" + esc(r.name) + '</span><button data-skip="' + esc(r.name) + '">' + (off ? "戻す" : "この日は消す") + "</button></div>"; }).join("");
    const cur = recHtml + (evs.length || recs.length ? "" : '<div class="empty">予定はありません。下から追加してください。</div>') + (evs.length ? evs.map((ev,i) => { const s = evStyle(ev); return '<div class="curev ' + s.cls + (s.bold ? " b" : "") + '">' + (ev.start ? '<span class="tm">' + esc(timeText(ev)) + "</span>" : "") + "<span>" + esc(ev.name) + '</span><button data-tm="' + i + '"' + (editTime === i ? ' aria-expanded="true"' : "") + '>編集</button><button data-rm="' + i + '" aria-label="' + esc(ev.name) + 'を削除">削除</button>' +
        (editTime === i ? '<div class="tedit"><input type="text" id="te-n" aria-label="予定の名前" value="' + esc(ev.name) + '"><span class="tl">時刻(空にすると時刻なし)</span><input type="time" id="te-s" aria-label="開始" value="' + esc(ev.start || "") + '"><span>〜</span><input type="time" id="te-e" aria-label="終了" value="' + esc(ev.end || "") + '"><button id="te-ok">保存</button></div>' : "") + "</div>"; }).join("") : "");
    let quick = "";
    state.cats.forEach(c => {
      const its = state.items.filter(it => it.cat === c.id);
      if (!its.length) return;
      quick += '<div class="lbl">' + esc(c.name) + '</div><div class="quick">' + its.map(it => {
        const s = evStyle({name: it.name, cat: it.cat}); const has = allEvs(k).some(e => e.name === it.name);
        return '<button class="qbtn ' + s.cls + (it.bold ? " b" : "") + '" data-add="' + esc(it.name) + '"' + (has ? " disabled" : "") + ">＋ " + esc(it.name) + "</button>";
      }).join("") + "</div>";
    });
    const keepText = $("free") ? $("free").value : "";
    const keepS = $("ns") ? $("ns").value : "", keepE = $("ne") ? $("ne").value : "";
    openSheet(
      '<div class="sh-head"><h3 id="sh-title">' + (d.getMonth()+1) + "月" + d.getDate() + "日(" + WD[d.getDay()] + ")</h3>" + (hn ? '<span class="hname">' + esc(hn) + "</span>" : "") + "</div>" +
      '<div class="cur" id="cur">' + cur + "</div>" +
      '<div class="lbl">時刻</div><div class="times"><input type="time" id="ns" aria-label="開始時刻" value="' + esc(keepS) + '"><span>〜</span><input type="time" id="ne" aria-label="終了時刻" value="' + esc(keepE) + '"></div>' + quick +
      '<div class="lbl"><label for="free">その他の予定</label></div><div class="free"><input type="text" id="free" placeholder="例:歯医者" value="' + esc(keepText) + '"><button class="btn pri small" id="free-add">追加</button></div>' +
      '<div class="catsel" id="catsel">' + state.cats.map(c => '<button class="c-' + esc(c.color) + '" data-cat="' + esc(c.id) + '" aria-pressed="' + (c.id === freeCat) + '">' + esc(c.name) + "</button>").join("") + "</div>" +
      '<div class="row"><button class="btn" id="sh-close">閉じる</button></div>'
    );
    $("sh-close").onclick = closeSheet;
    $("cur").onclick = e => {
      const sb = e.target.closest("[data-skip]");
      if (sb){ toggleSkip(k, sb.dataset.skip); return; }
      const rm = e.target.closest("[data-rm]");
      if (rm){ editTime = null; changeDay(k, list => list.filter((_,i) => i !== +rm.dataset.rm), "削除しました"); return; }
      const tm = e.target.closest("[data-tm]");
      if (tm){ editTime = editTime === +tm.dataset.tm ? null : +tm.dataset.tm; drawDay(); if (editTime !== null && $("te-n")) $("te-n").focus(); return; }
      if (e.target.id === "te-ok") saveEdit();
    };
    // 予定の編集(名前・時刻)。新しい名前が「よく使う予定」と同じなら、その色・カテゴリにそろえる
    function saveEdit(){
      const i = editTime; if (i === null || !$("te-n")) return;
      const n = $("te-n").value.trim(), s = $("te-s").value, en = $("te-e").value;
      if (!n){ toast("予定の名前を入力してください"); return; }
      editTime = null;
      changeDay(k, list => list.map((ev,j) => { if (j !== i) return ev; const it = n !== ev.name ? itemByName(n) : null; const r = {name: n, cat: it ? it.cat : ev.cat}; if (s) r.start = s; if (s && en) r.end = en; return r; }), "保存しました");
    }
    if ($("te-n")) $("te-n").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing){ e.preventDefault(); saveEdit(); } });
    const withTime = (ev) => { const s = $("ns").value, en = $("ne").value; if (s) ev.start = s; if (s && en) ev.end = en; $("ns").value = ""; $("ne").value = ""; return ev; };
    $("sheet-in").querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
      const it = itemByName(b.dataset.add); if (!it) return;
      const ev = withTime({name: it.name, cat: it.cat});
      changeDay(k, list => list.concat([ev]), "追加しました");
    });
    $("catsel").onclick = e => { const b = e.target.closest("[data-cat]"); if (!b) return; freeCat = b.dataset.cat; $("catsel").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); };
    const addFree = () => {
      const v = $("free").value.trim(); if (!v) { toast("予定の内容を入力してください"); return; }
      if (!freeCat){ toast("先に設定でカテゴリを追加してください"); return; }
      $("free").value = "";
      const it = itemByName(v);
      const ev = withTime({name: v, cat: it ? it.cat : freeCat});
      changeDay(k, list => list.concat([ev]), "追加しました");
    };
    $("free-add").onclick = addFree;
    $("free").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing){ e.preventDefault(); addFree(); } });
  }

  // ---------- writes ----------
  let chain = Promise.resolve();
  function queue(fn){ const p = chain.then(fn); chain = p.catch(() => {}); return p; }
  function errMsg(err){
    const c = err && err.code;
    if (c === "invalid_argument") return "このアカウントでは編集できません";
    if (c === "quota_exceeded") return "保存できる量の上限に達しました";
    if (!state.db) return "保存できませんでした。アプリを開き直してください";

  // ---------- backup ----------
  function backupData(){
    const days = {}; Object.keys(store.days).forEach(k => { if (!store.days[k]._del) days[k] = store.days[k]; });
    return {app: "my-schedule", version: 1, exportedAt: new Date().toISOString(), days, config: store.config};
  }
  $("btn-export").onclick = async () => {
    const d = new Date(); const name = "my-schedule-" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + ".json";
    const text = JSON.stringify(backupData(), null, 1);
    const blob = new Blob([text], {type: "application/json"});
    try {
      const file = new File([blob], name, {type: "application/json"});
      if (navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: name}); return; }
    } catch(e){ if (e && e.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("書き出しました");
  };
  $("btn-import").onclick = () => $("imp-file").click();
  $("imp-file").onchange = async (e) => {
    const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
    let data;
    try { data = JSON.parse(await f.text()); } catch(_){ toast("ファイルを読み込めませんでした"); return; }
    if (!data || typeof data.days !== "object" || typeof data.config !== "object"){ toast("このアプリのバックアップファイルではありません"); return; }
    const n = Object.keys(data.days).length;
    $("impconf").innerHTML = '<div class="confirm">今の予定を、バックアップの内容(' + n + ' 日分)で置き換えます。<div class="row" style="margin-top:8px"><button class="btn" id="ip-no">やめる</button><button class="btn pri" id="ip-yes">置き換える</button></div></div>';
    $("ip-no").onclick = () => { $("impconf").innerHTML = ""; };
    $("ip-yes").onclick = () => {
      const prev = store; const now = Date.now();
      const next = {days: clone(data.days), config: Object.assign(stampedDefaults(), clone(data.config))};
      // 読み込んだ内容を「いちばん新しい変更」として扱う(同期先も置き換わる)
      Object.keys(store.days).forEach(k => { if (!next.days[k]) next.days[k] = {_t: now, _del: true}; });
      Object.values(next.days).forEach(v => { v._t = now; });
      Object.values(next.config).forEach(v => { v._t = now; });
      store = next;
      try { persist(); } catch(err){ store = prev; toast(errMsg(err)); return; }
      $("impconf").innerHTML = ""; emitAll(); scheduleSync(100); toast(n + " 日分を読み込みました");
    };
  };

  // ---------- sync (自分のGoogleスプレッドシート経由で2台を同期) ----------
  const SYNC_KEY = "myschedule.sync";
  const tOf = (v) => (v && typeof v._t === "number") ? v._t : 1;
  function mergeStore(a, b){
    const res = {days: {}, config: {}};
    ["days", "config"].forEach(sec => {
      const A = (a && a[sec]) || {}, B = (b && b[sec]) || {};
      new Set(Object.keys(A).concat(Object.keys(B))).forEach(k => {
        const x = A[k], y = B[k];
        res[sec][k] = !x ? y : !y ? x : (tOf(y) > tOf(x) ? y : x);
      });
    });
    return res;
  }
  function loadSync(){ try { const v = JSON.parse(localStorage.getItem(SYNC_KEY) || "null"); if (v && v.url && v.token) return v; } catch(_){} return null; }
  let syncCfg = loadSync(), syncing = false, syncAgain = false, syncTimer = null, lastSync = null, syncErr = "";
  function renderSync(){
    const st = $("sync-status");
    $("sync-off").hidden = !!syncCfg; $("sync-on").hidden = !syncCfg;
    st.className = "sync-status";
    if (!syncCfg){ st.textContent = "未接続(このスマホだけに保存しています)"; return; }
    if (syncing){ st.textContent = "同期中…"; return; }
    if (syncErr){ st.textContent = syncErr; st.classList.add("err"); return; }
    if (lastSync){ st.textContent = "同期済み(最終 " + lastSync.getHours() + ":" + pad(lastSync.getMinutes()) + ")"; st.classList.add("ok"); return; }
    st.textContent = "接続済み";
  }
  function scheduleSync(delay){ if (!syncCfg) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, delay == null ? 1500 : delay); }
  async function syncNow(){
    if (!syncCfg) return;
    if (syncing){ syncAgain = true; return; }
    syncing = true; renderSync();
    try {
      const res = await fetch(syncCfg.url, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify({token: syncCfg.token, data: store}), redirect: "follow", cache: "no-store"});
      const j = await res.json();
      if (!j || !j.ok) throw new Error((j && j.error) || "error");
      // 待っている間にこのスマホで変えた分も残す
      const merged = mergeStore(j.data, store);
      const changed = JSON.stringify(merged) !== JSON.stringify(store);
      store = merged;
      try { persist(); } catch(_){}
      if (changed) emitAll();
      lastSync = new Date(); syncErr = "";
    } catch(e){
      syncErr = e && e.message === "unauthorized" ? "接続コードが正しくありません。設定し直してください" : "同期できませんでした。電波のある場所で開き直すと再開します";
    }
    syncing = false; renderSync();
    if (syncAgain){ syncAgain = false; scheduleSync(300); }
  }
  function parseCode(raw){
    try {
      let t = String(raw || "").replace(/\s+/g, "");
      if (t.startsWith("MS1.")) t = t.slice(4);
      t = t.replace(/-/g, "+").replace(/_/g, "/"); while (t.length % 4) t += "=";
      const bin = atob(t); const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
      const o = JSON.parse(new TextDecoder().decode(bytes));
      if (o && typeof o.u === "string" && typeof o.t === "string" && /^(https:\/\/|http:\/\/localhost)/.test(o.u)) return {url: o.u, token: o.t};
    } catch(_){}
    return null;
  }
  $("sync-connect").onclick = async () => {
    const cfg = parseCode($("sync-code").value);
    if (!cfg){ toast("接続コードを確認してください"); return; }
    syncCfg = cfg; try { localStorage.setItem(SYNC_KEY, JSON.stringify(cfg)); } catch(_){}
    $("sync-code").value = "";
    await syncNow();
    toast(syncErr ? "接続できませんでした" : "同期しました");
  };
  $("sync-now").onclick = async () => { await syncNow(); toast(syncErr ? "同期できませんでした" : "同期しました"); };
  $("sync-stop").onclick = () => {
    syncCfg = null; syncErr = ""; lastSync = null; clearTimeout(syncTimer);
    try { localStorage.removeItem(SYNC_KEY); } catch(_){}
    renderSync(); toast("同期をやめました(予定はこのスマホに残ります)");
  };
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") scheduleSync(200); });
  window.addEventListener("online", () => scheduleSync(200));
  setInterval(() => { if (document.visibilityState === "visible" && $("sheet").hidden) syncNow(); }, 60000);
  renderSync();

  // ---------- connect ----------
  render();
  if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
  (async () => {
    const db = localDb;
    state.db = db;
    if (!storageOk){ const bn = $("banner"); bn.hidden = false; bn.textContent = "このブラウザでは予定を保存できません。プライベートブラウズをオフにしてください。"; }
    const seen = new Set(); const done = (n) => { seen.add(n); if (seen.size >= 5) state.ready = true; render(); if (sheetDay) drawDay(); };
    const onErr = () => { const bn = $("banner"); bn.hidden = false; bn.textContent = "データを読み込めませんでした。ページを開き直してください。"; };
    const arr = (s) => { const v = s.exists ? (s.data() || {}) : {}; return Array.isArray(v.items) ? v.items : []; };
    db.collection("days").onSnapshot(snap => {
      const m = {}, sk = {}; snap.docs.forEach(d => { const v = d.data() || {}; if (Array.isArray(v.events)) m[d.id] = sortEvs(v.events.map(cleanEv).filter(e => e.name)); if (Array.isArray(v.skip) && v.skip.length) sk[d.id] = v.skip.map(String); });
      state.days = m; state.skips = sk; done("days");
    }, onErr);
    db.doc("config/categories").onSnapshot(s => { state.cats = arr(s).map(c => { const r = {id: String(c.id), name: String(c.name || ""), color: String(c.color || "gray")}; if (c.fill) r.fill = true; return r; }); done("cats"); }, onErr);
    db.doc("config/items").onSnapshot(s => { state.items = arr(s).map(x => { const r = {name: String(x.name || ""), cat: String(x.cat || ""), bold: !!x.bold}; if (x.fill) r.fill = true; if (x.color) r.color = String(x.color); return r; }); done("items"); }, onErr);
    db.doc("config/recurring").onSnapshot(s => { state.rec = arr(s).map(x => { const r = {name: String(x.name || ""), cat: String(x.cat || ""), type: x.type === "monthly" ? "monthly" : "weekly"}; if (r.type === "weekly") r.dow = +x.dow || 0; else r.day = +x.day || 1; return r; }).filter(r => r.name); done("rec"); }, onErr);
    scheduleSync(300);
    db.doc("config/holidays").onSnapshot(s => { state.holidays = arr(s).map(x => ({date: String(x.date || ""), name: String(x.name || "")})); done("hol"); }, onErr);
  })();
})();
</script>
</body>
</html>
